<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acesso restrito · Colégio Pitágoras</title>
<style>
  :root{--paper:#F3F4F6;--panel:#FFFFFF;--ink:#161A22;--muted:#5A6272;--line:#CFD5DE;--accent:#1F4E8C;--serif:Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media(prefers-color-scheme:dark){:root{--paper:#12151B;--panel:#1A1E26;--ink:#E9ECF2;--muted:#A0A7B4;--line:#363D4A;--accent:#7FA8E0}}
  *{box-sizing:border-box}html{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:var(--sans);padding:24px}
  .gate{width:100%;max-width:380px;text-align:center}
  .lock{width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 22px;color:var(--accent)}
  .lock svg{width:24px;height:24px}
  .quem{width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto 20px;border:2px solid var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .quem img{width:100%;height:100%;object-fit:cover;display:block}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:650;margin:0 0 10px}
  h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 10px}
  .sub{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:1.5}
  form{display:flex;flex-direction:column;gap:10px}
  input{font-family:var(--serif);font-size:24px;text-align:center;letter-spacing:.3em;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{font-family:var(--sans);font-size:15px;font-weight:600;padding:13px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer}
  button:hover{filter:brightness(1.06)}
  .err{color:#c0392b;font-size:13px;margin:14px 0 0}
  .foot{margin-top:26px;font-size:11.5px;color:var(--muted)}
</style></head>
<body><div class="gate">
  <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
  <p class="eyebrow">Diário de Leitura · Colégio Pitágoras</p>
  <h1>Relatório de Leitura</h1>
  <p class="sub">Esse conteúdo é seu e privado. Digite o PIN que você recebeu para abrir.</p>
  <form method="POST" action="/parceiros/pitagoras/auth">
    <input name="pin" inputmode="numeric" autocomplete="off" autofocus aria-label="PIN de acesso" maxlength="12" placeholder="••••">
    <button type="submit">Abrir relatório</button>
  </form>
  
  <p class="foot">Precisa do PIN? Fale com o Rodrigo.</p>
</div></body></html>
